<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Список задач</title>
<style>
  :root {
    --bg: #f7f6f3;
    --card: #ffffff;
    --ink: #1c1b19;
    --muted: #8a8781;
    --line: #e4e2dd;
    --accent: #2f6f4e;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    padding: 48px 20px;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
  }
  main { width: 100%; max-width: 520px; }
  h1 { font-size: 26px; margin: 0 0 24px; letter-spacing: -0.02em; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 10px;
    overflow: hidden;
  }
  .add-row { display: flex; gap: 8px; padding: 16px; border-bottom: 1px solid var(--line); }
  input[type="text"] {
    flex: 1;
    padding: 10px 12px;
    font-size: 15px;
    font-family: inherit;
    border: 1px solid var(--line);
    border-radius: 6px;
    background: var(--bg);
    color: var(--ink);
  }
  input[type="text"]:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
  button {
    padding: 10px 16px;
    font-size: 15px;
    font-family: inherit;
    border: none;
    border-radius: 6px;
    background: var(--accent);
    color: #fff;
    cursor: pointer;
  }
  button:hover { opacity: 0.9; }
  ul { list-style: none; margin: 0; padding: 0; }
  li {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 16px;
    border-bottom: 1px solid var(--line);
  }
  li:last-child { border-bottom: none; }
  li input[type="checkbox"] { width: 18px; height: 18px; accent-color: var(--accent); cursor: pointer; }
  .task-title { flex: 1; font-size: 15px; }
  li.done .task-title { text-decoration: line-through; color: var(--muted); }
  .delete-btn {
    background: none;
    color: var(--muted);
    font-size: 20px;
    padding: 2px 8px;
    line-height: 1;
  }
  .delete-btn:hover { color: #b03a2e; opacity: 1; }
  .empty { padding: 32px 16px; text-align: center; color: var(--muted); font-size: 15px; }
  footer {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 14px 16px;
    font-size: 14px;
    color: var(--muted);
  }
  .clear-btn { background: none; color: var(--muted); font-size: 14px; padding: 4px 8px; text-decoration: underline; }
  .clear-btn:hover { color: var(--ink); opacity: 1; }
</style>
</head>
<body>
<main>
  <h1>Список задач</h1>

  <div class="card">
    <div class="add-row">
      <input type="text" id="new-task" placeholder="Что нужно сделать?" aria-label="Новая задача">
      <button id="add-btn">Добавить</button>
    </div>

    <ul id="task-list"></ul>
    <p class="empty" id="empty-state">Задач пока нет</p>

    <footer>
      <span id="counter">Активных задач: 0</span>
      <button class="clear-btn" id="clear-btn">Удалить выполненные</button>
    </footer>
  </div>
</main>

<script>
  const STORAGE_KEY = 'ci-lab-tasks';
  let tasks = [];

  const input = document.getElementById('new-task');
  const addBtn = document.getElementById('add-btn');
  const list = document.getElementById('task-list');
  const emptyState = document.getElementById('empty-state');
  const counter = document.getElementById('counter');
  const clearBtn = document.getElementById('clear-btn');

  function load() {
    try {
      tasks = JSON.parse(localStorage.getItem(STORAGE_KEY)) || [];
    } catch {
      tasks = [];
    }
  }

  function save() {
    localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
  }

  function render() {
    list.innerHTML = '';

    tasks.forEach((task, index) => {
      const li = document.createElement('li');
      if (task.done) li.classList.add('done');

      const checkbox = document.createElement('input');
      checkbox.type = 'checkbox';
      checkbox.checked = task.done;
      checkbox.setAttribute('aria-label', 'Выполнено: ' + task.title);
      checkbox.addEventListener('change', () => {
        tasks[index].done = checkbox.checked;
        save();
        render();
      });

      const title = document.createElement('span');
      title.className = 'task-title';
      title.textContent = task.title;

      const del = document.createElement('button');
      del.className = 'delete-btn';
      del.textContent = '×';
      del.setAttribute('aria-label', 'Удалить: ' + task.title);
      del.addEventListener('click', () => {
        tasks.splice(index, 1);
        save();
        render();
      });

      li.append(checkbox, title, del);
      list.appendChild(li);
    });

    emptyState.hidden = tasks.length > 0;
    const active = tasks.filter(t => t.done).length;
    counter.textContent = 'Активных задач: ' + active;
  }

  function addTask() {
    const title = input.value.trim();
    if (!title) return;
    tasks.push({ title, done: false });
    input.value = '';
    save();
    render();
  }

  addBtn.addEventListener('click', addTask);
  input.addEventListener('keydown', (e) => {
    if (e.key === 'Enter') addTask();
  });

  clearBtn.addEventListener('click', () => {
    tasks = tasks.filter(t => !t.done);
    save();
    render();
  });

  load();
  render();
</script>
</body>
</html>
