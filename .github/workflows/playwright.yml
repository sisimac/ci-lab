name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── ШАГ 1: проверка кода линтером ──────────────────
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── ШАГ 2: тесты. Стартует только если lint зелёный ──
  test:
    name: Тесты
    runs-on: ubuntu-latest
    needs: lint          # ← вот эта строка создаёт стрелку в графе
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Установка браузеров
        run: npx playwright install --with-deps
      - name: Прогон тестов
        run: npx playwright test
      - name: Выгрузка отчёта
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── ШАГ 3: сборка. Стартует только если тесты зелёные ──
  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка артефакта для деплоя
        run: |
          mkdir -p dist
          cp -r app/* dist/
          echo "Собрано: $(date)" > dist/build-info.txt
      - name: Выгрузка сборки
        uses: actions/upload-artifact@v4
        with:
          name: site
          path: dist/
          retention-days: 7