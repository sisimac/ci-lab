name: Playwright Tests

# Когда запускать пайплайн
on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    # Виртуальная машина на стороне GitHub — твой мак здесь не участвует
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Скачать код репозитория на раннер
      - uses: actions/checkout@v4

      # 2. Поставить Node нужной версии
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      # 3. Установить зависимости строго по package-lock.json
      - name: Установка зависимостей
        run: npm ci

      # 4. Скачать браузеры + системные библиотеки для Linux.
      #    Здесь PLAYWRIGHT_BROWSERS_PATH не нужен: раннер одноразовый.
      - name: Установка браузеров
        run: npx playwright install --with-deps

      # 5. Прогон тестов
      - name: Прогон тестов
        run: npx playwright test

      # 6. Сохранить отчёт как артефакт — скачивается со страницы прогона.
      #    if: always() — выгружать и при падении, иначе разбирать будет нечего.
      - name: Выгрузка отчёта
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7
