name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── ШАГ 1: проверка кода линтером ──────────────────
  lint:
    name: Линтер
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run lint

  # ── ШАГ 2: тесты. Стартует только если lint зелёный ──
  test:
    name: Тесты
    runs-on: ubuntu-latest
    needs: lint          # ← вот эта строка создаёт стрелку в графе
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Установка браузеров
        run: npx playwright install --with-deps
      - name: Прогон тестов
        run: npx playwright test --grep-invert @smoke
      - name: Выгрузка отчёта
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  # ── ШАГ 3: сборка артефакта для деплоя ──────────────
  build:
    name: Сборка
    runs-on: ubuntu-latest
    needs: test
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Подготовка артефакта
        run: |
          mkdir -p dist
          cp -r app/* dist/
          echo "Собрано: $(date)" > dist/build-info.txt
      - name: Настройка Pages
        uses: actions/configure-pages@v5
      - name: Выгрузка артефакта для Pages
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist/

  # ── ШАГ 4: деплой. Только из main и только после апрува ──
  deploy:
    name: Деплой
    runs-on: ubuntu-latest
    needs: build
    # Деплоим только при пуше в main, не на pull request
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    # Привязка к окружению — отсюда берётся требование апрува
    environment:
      name: production
      url: ${{ steps.deployment.outputs.page_url }}

    # Отдаём адрес сайта наружу, чтобы джоба smoke могла его прочитать
    outputs:
      page_url: ${{ steps.deployment.outputs.page_url }}

    # Права, необходимые для публикации на Pages
    permissions:
      pages: write
      id-token: write

    steps:
      - name: Публикация на GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  # ── ШАГ 5: смоук по развёрнутому сайту ──────────────
  smoke:
    name: Смоук после деплоя
    runs-on: ubuntu-latest
    needs: deploy
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - name: Установка браузера
        run: npx playwright install --with-deps chromium
      - name: Прогон смоука по боевому адресу
        env:
          BASE_URL: ${{ needs.deploy.outputs.page_url }}
        run: npx playwright test --project=chromium --grep @smoke
