version: 2
updates:
  # Следим за версиями GitHub Actions (checkout, setup-node и т.д.)
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "ci"
      # Собираем все обновления экшенов в один PR — иначе каждый мёрж
      # запускает отдельный деплой с ручным апрувом
    groups:
      github-actions:
        patterns:
          - "*"

  # Следим за npm-пакетами (playwright, eslint)
  - package-ecosystem: "npm"
    directory: "/"
    schedule:
      interval: "weekly"
    commit-message:
      prefix: "deps"
    # Группируем мелкие обновления в один PR, чтобы не заваливало
    groups:
      dev-dependencies:
        dependency-type: "development"
